name: MDM 30-minute Tracker

on:
  schedule:
    # 05:30 AM to 09:00 PM IST (00:00 to 15:30 UTC), every 30 minutes.
    - cron: '0,30 0-15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live MDM snapshot
        run: |
          echo "Triggering Assam MDM tracker snapshot..."
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 20 \
            --max-time 1200 \
            -X POST \
            "https://assam-mdm-dashboard.onrender.com/api/tracker/run?source=github-actions"

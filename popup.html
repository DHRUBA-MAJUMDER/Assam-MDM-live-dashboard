<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;width:330px;padding:14px;color:#172033}
h3{margin:0 0 10px} label{font-size:12px;font-weight:700;display:block;margin-top:10px}
input{width:100%;box-sizing:border-box;padding:8px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row input[type=checkbox]{width:auto}
button{width:100%;padding:10px;margin-top:12px;border:0;border-radius:7px;background:#175cd3;color:white;font-weight:700;cursor:pointer}
button.secondary{background:#596579}
small{display:block;line-height:1.4;color:#5a6577;margin-top:8px}
#bar{height:8px;background:#e5e8ee;border-radius:10px;overflow:hidden;margin-top:12px}
#fill{height:100%;width:0;background:#175cd3}
#status{font-size:12px;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<h3>Assam MDM Historical Sync</h3>
<label>Report date</label>
<input id="date" type="date">
<label>District code</label>
<input id="district" value="1824" placeholder="e.g. 1824">
<div class="row"><input id="all" type="checkbox"><span>Sync all Assam (can take a long time)</span></div>
<button id="start">Start Sync</button>
<button id="open" class="secondary">Open Historical Page</button>
<div id="bar"><div id="fill"></div></div>
<div id="status">Ready.</div>
<small>Keep the PM POSHAN tab open and logged in while sync runs. Only hierarchy/reporting rows are uploaded; login cookies are not uploaded.</small>
<script src="popup.js"></script>
</body>
</html>

name: MDM Public District Archive

on:
  schedule:
    # 05:45 PM IST = 12:15 PM UTC
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-districts:
    runs-on: ubuntu-latest
    steps:
      - name: Save public district report
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 30 \
            --max-time 300 \
            -X POST \
            "https://assam-mdm-dashboard.onrender.com/api/official/archive/final?source=github-actions"

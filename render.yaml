services:
  - type: web
    name: assam-mdm-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 1200
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: assam-mdm-tracker-db
          property: connectionString

databases:
  - name: assam-mdm-tracker-db
    plan: free
    databaseName: mdm_tracker
    user: mdm_tracker_user

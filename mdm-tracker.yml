name: MDM 30-minute Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live MDM snapshot
        run: |
          echo "Triggering Assam MDM tracker snapshot..."
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 20 \
            --max-time 1200 \
            -X POST \
            "https://assam-mdm-dashboard.onrender.com/api/tracker/run?source=github-actions"

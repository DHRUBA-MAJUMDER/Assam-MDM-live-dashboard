name: MDM Daily School Gap Capture

on:
  schedule:
    # 05:10 PM IST = 11:40 AM UTC. Captures same-day school gaps soon after normal reporting closes.
    - cron: '40 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-gaps:
    runs-on: ubuntu-latest
    steps:
      - name: Capture schools still not reported
        run: |
          echo "Capturing daily MDM school gaps..."
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 20 \
            --max-time 1200 \
            -X POST \
            "https://assam-mdm-dashboard.onrender.com/api/history/school-gaps/run?source=github-actions"
